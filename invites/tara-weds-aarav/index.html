<style>
:root{
  --powder:#BFD4E6; --wisteria:#C6B3D9; --blush:#F1D3D3; --ivory:#FBF7F0; --sage:#B5C4A8;
  --marigold:#E2A23B; --gold:#C2A15B; --ink:#1F2A44; --gold-hi:#EFE0B0; --gold-lo:#A88743;
  --gold-deep:#76591f; --ink-soft:#3b4566; --paper:#f4ecdc; --paper-ink:#2a221c; --plum:#3a2c4f;
  --foil:linear-gradient(100deg,#EFE0B0 0%,#d7be7e 22%,#A88743 45%,#f3e6bd 62%,#b8964f 82%,#EFE0B0 100%);
  --script:"Pinyon Script",cursive; --serif:"Playfair Display",Georgia,serif;
  --fell:"IM Fell English",Georgia,serif; --sc:"Cormorant SC",Georgia,serif;
  --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --col:480px; --grain:none;
  --ease-paper:cubic-bezier(.22,.9,.28,1.06); --ease-soft:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:400 17px/1.6 var(--fell);background:#c4d5e7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
img,svg,canvas,video{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px;border-radius:4px}

/* ---------- desktop wallpaper ---------- */
.wall{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:#c7d7e8;background-size:150px 200px}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(31,42,68,.28) 100%)}
.wall-wis{position:fixed;top:-10px;width:min(26vw,320px);height:78vh;z-index:0;pointer-events:none;display:none}
.wall-wis.l{left:max(0px,calc(50vw - var(--col)/2 - 330px))}
.wall-wis.r{right:max(0px,calc(50vw - var(--col)/2 - 330px));transform:scaleX(-1)}
@media (min-width:760px){.wall-wis{display:block}}

/* ---------- column ---------- */
.invite{position:relative;z-index:1;max-width:var(--col);margin:0 auto;background:var(--ivory);overflow:hidden;overflow:clip;box-shadow:0 0 0 1px rgba(194,161,91,.5),0 30px 80px rgba(31,42,68,.35)}
.sec{position:relative;padding:72px 22px;overflow:hidden;overflow:clip}
.paperbg{background-color:var(--ivory);background-image:var(--grain),radial-gradient(ellipse at 50% 0%,#fffdf8 0%,transparent 70%)}
.kicker{font:600 14px/1.4 var(--sc);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);text-align:center;margin:0 0 6px;padding-left:.22em}
.title{font:italic 400 clamp(30px,8.4vw,40px)/1.15 var(--serif);text-align:center;margin:0;color:var(--ink)}
.title b{font-weight:400;font-family:var(--script);font-size:1.25em;display:inline-block;padding:0 .12em}
.lede{text-align:center;font-style:italic;color:var(--ink-soft);margin:10px auto 0;max-width:34ch}
.divider{width:min(240px,70%);height:auto;margin:16px auto;display:block}
.foil{background:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.script{font-family:var(--script);font-weight:400;line-height:1.45;padding:0 .3em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:2px;border:1px solid var(--gold-lo);background:linear-gradient(#fffdf7,#f4ecd9);color:var(--ink);font:600 14px/1.1 var(--sc);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(31,42,68,.12);transition:transform .25s var(--ease-soft),box-shadow .25s,background .3s}
.btn:hover{box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(31,42,68,.16)}
.btn:active{transform:translateY(1px)}
.btn-ink{background:linear-gradient(#2a3658,#1F2A44);color:#f6eed8;border-color:#0f1628;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(31,42,68,.3)}
.btn-ink:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(31,42,68,.3)}
.btn svg{width:18px;height:18px;flex:none}

/* ================= OPENER ================= */
.opener{position:fixed;inset:0;z-index:50;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
   radial-gradient(ellipse 70% 50% at 50% 46%,rgba(255,196,120,.16),transparent 70%),
   repeating-linear-gradient(93deg,rgba(255,220,180,.025) 0 3px,transparent 3px 11px,rgba(0,0,0,.05) 11px 13px,transparent 13px 23px),
   radial-gradient(ellipse at 50% 42%,#5b3a26 0%,#3a2417 45%,#1d110a 80%,#0d0705 100%);color:#f3e6c4}
.opener::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.5;mix-blend-mode:overlay}
.op-pool{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,190,110,.22) 0%,rgba(255,170,90,.08) 25%,transparent 50%);pointer-events:none;will-change:opacity,transform}
.op-candle{position:absolute;top:calc(50% - 250px);width:58px;height:150px;pointer-events:none}
.op-candle.l{left:calc(50% - 205px)} .op-candle.r{right:calc(50% - 205px);top:calc(50% - 232px)}
@media (max-width:430px){.op-candle.l{left:8px;top:calc(50% - 300px)}.op-candle.r{right:8px;top:calc(50% - 286px)}}
.op-candle svg{width:100%;height:100%;overflow:visible}
.op-stage{position:relative;width:min(92vw,400px);aspect-ratio:4/3;display:grid;place-items:center;will-change:transform,opacity}
.op-tray{position:absolute;inset:0;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55))}
.op-tray svg{width:100%;height:100%}
.letter{--lw:min(74vw,292px);--lh:calc(var(--lw)*.6);position:relative;width:var(--lw);height:var(--lh);will-change:transform}
.lt-shadow{position:absolute;inset:4% 2% -2% 2%;background:rgba(10,5,2,.55);filter:blur(10px);border-radius:6px;transform:translateY(6px);will-change:transform,opacity}
.panel{position:absolute;left:0;width:100%;height:100%;transform-style:preserve-3d}
.p-mid{top:0}
.p-top{bottom:100%;transform-origin:50% 100%;transform:perspective(1300px) rotateX(-180deg)}
.p-bot{top:100%;transform-origin:50% 0;transform:perspective(1300px) rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;color:var(--ink);text-align:center;
  background-color:#fbf6ea;background-image:var(--grain),linear-gradient(160deg,#fffdf6,#f3ead6)}
.face.back{transform:rotateX(180deg)}
.face .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,25,10,.55),rgba(40,25,10,.25));opacity:0;pointer-events:none}
.p-top .face.front .shade{opacity:.6}.p-bot .face.front .shade{opacity:.6}
.face .warm{position:absolute;inset:0;background:radial-gradient(ellipse at 15% -10%,rgba(255,190,110,.35),transparent 60%);pointer-events:none;mix-blend-mode:multiply}
.p-top .face.front{border-radius:3px 3px 0 0}.p-bot .face.front{border-radius:0 0 3px 3px}
.p-mid .face{box-shadow:inset 0 1px 0 rgba(120,90,50,.18),inset 0 -1px 0 rgba(120,90,50,.18)}
.lt-in{position:absolute;inset:10px;border:1px solid rgba(168,135,67,.55);outline:1px solid rgba(168,135,67,.25);outline-offset:-5px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}
.p-top .lt-in{border-bottom:0;inset:10px 10px 0}.p-bot .lt-in{border-top:0;inset:0 10px 10px}.p-mid .lt-in{border-top:0;border-bottom:0;inset:0 10px}
.lt-in .crest{width:52px;height:auto}
.lt-bless{font:16px/1.3 var(--deva);color:var(--gold-deep);margin:4px 0 0}
.lt-small{font:600 12.5px/1.35 var(--sc);letter-spacing:.18em;color:var(--gold-deep);margin:2px 0;text-transform:uppercase}
.lt-names{font:400 34px/1.25 var(--script);color:var(--ink);margin:0;padding:0 .2em}
.lt-amp{font:italic 15px/1 var(--serif);color:var(--gold-deep)}
.lt-line{font:italic 15px/1.35 var(--serif);color:var(--ink-soft);margin:2px 0}
.lt-addr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 14px}
.lt-addr .to{font:600 12.5px/1 var(--sc);letter-spacing:.24em;color:var(--gold-deep);text-transform:uppercase}
.lt-addr .who{font:400 30px/1.35 var(--script);color:var(--ink);padding:0 .2em;margin-top:2px;max-width:100%;overflow-wrap:anywhere}
.p-top .face.back{background-image:var(--grain),linear-gradient(200deg,#fffaf0,#efe4cd)}
.ribbon{position:absolute;left:-5%;right:-5%;top:50%;height:30px;margin-top:-15px;pointer-events:none}
.ribbon .band{position:absolute;inset:0;background:linear-gradient(180deg,#a996c4 0%,#d7c9ea 22%,#bca8d7 45%,#9a84bb 70%,#c3b2dd 100%);box-shadow:0 2px 4px rgba(30,15,40,.35)}
.ribbon .band::after{content:"";position:absolute;inset:3px 0;border-top:1px dashed rgba(255,255,255,.35);border-bottom:1px dashed rgba(255,255,255,.25)}
.ribbon .bow{position:absolute;left:14%;top:50%;width:96px;height:92px;margin:-40px 0 0 -48px;filter:drop-shadow(0 3px 3px rgba(30,15,40,.45))}
.seal{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px}
.seal-piece{position:absolute;inset:0;will-change:transform,opacity}
.seal-piece svg,.seal-crack{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal-piece:first-child{filter:drop-shadow(0 3px 2px rgba(20,8,30,.5))}
.seal-crack path{stroke-dasharray:200;stroke-dashoffset:200}
.op-hit{position:absolute;inset:0;z-index:5;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.op-hit:focus-visible{outline:2px solid #EFE0B0;outline-offset:-8px}
.op-text{position:absolute;left:0;right:0;bottom:max(7vh,34px);text-align:center;padding:0 22px;pointer-events:none}
.op-kicker{font:600 14px/1.5 var(--sc);letter-spacing:.2em;text-transform:uppercase;margin:0;color:#f1e3bf;text-shadow:0 1px 8px rgba(0,0,0,.6);padding-left:.26em}
.op-kicker .nm{display:block;font:400 34px/1.4 var(--script);letter-spacing:0;text-transform:none;padding:0 .3em}
.op-hint{font:italic 15px/1.4 var(--fell);color:#d9c79c;margin:8px 0 0;opacity:.85;animation:breathe 3.6s ease-in-out infinite}
.op-brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:600 12px/1 var(--sc);letter-spacing:.32em;color:rgba(239,224,176,.6);text-transform:uppercase;padding-left:.32em}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* ================= CHRONICLE ================= */
.sec-chronicle{padding:40px 14px 56px;background:#d9cdb6;background-image:var(--grain),radial-gradient(ellipse at 50% 30%,#e6dcc7,#c9bb9f 90%)}
.news{position:relative;padding:20px 16px 26px;color:var(--paper-ink);background-color:#f2e9d6;
  background-image:
   radial-gradient(circle at 12% 18%,rgba(160,110,50,.10) 0 5px,transparent 6px),
   radial-gradient(circle at 84% 62%,rgba(160,110,50,.08) 0 9px,transparent 11px),
   radial-gradient(circle at 30% 88%,rgba(160,110,50,.07) 0 7px,transparent 9px),
   var(--grain),
   radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(150,110,60,.22) 100%),
   linear-gradient(175deg,#f6eedc,#ece0c6);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 18px 40px rgba(60,40,20,.28);transform-origin:50% 0;opacity:0}
.news.in{opacity:1}
.news::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.6%,rgba(90,60,30,.10) 50%,transparent 50.4%),linear-gradient(0deg,transparent 33%,rgba(90,60,30,.06) 33.3%,transparent 33.6%);mix-blend-mode:multiply}
.inky{filter:url(#f-ink)}
.mh-top{display:flex;justify-content:space-between;font:600 11.5px/1.2 var(--sc);letter-spacing:.12em;border-bottom:1px solid currentColor;padding-bottom:5px;gap:6px}
.mh-title{font:900 clamp(30px,9.4vw,44px)/.95 var(--serif);text-align:center;margin:10px 0 6px;letter-spacing:-.01em;text-transform:uppercase}
.mh-title small{display:block;font:italic 400 .36em/1.2 var(--fell);text-transform:none;letter-spacing:.02em;margin-bottom:4px}
.mh-rule{height:6px;border-top:3px double currentColor;border-bottom:1px solid currentColor}
.mh-sub{display:flex;justify-content:center;gap:8px;align-items:center;font:italic 14px/1.4 var(--fell);padding:4px 0;border-bottom:1px solid currentColor;text-align:center}
.headline{font:900 clamp(31px,9vw,42px)/1 var(--serif);text-transform:uppercase;text-align:center;margin:16px 0 8px;letter-spacing:-.005em}
.deck{font:italic 16px/1.35 var(--fell);text-align:center;margin:0 auto 12px;max-width:36ch;border-bottom:1px solid currentColor;padding-bottom:12px}
.news-fig{margin:0 auto 10px;width:min(78%,250px);text-align:center}
.news-fig svg,.news-fig img{width:100%;height:auto}
.news-fig figcaption{font:italic 13px/1.35 var(--fell);margin-top:4px}
.cols{column-count:2;column-gap:14px;column-rule:1px solid rgba(42,34,28,.55);text-align:justify;hyphens:auto;-webkit-hyphens:auto;font-size:14.5px;line-height:1.4;word-spacing:-.02em}
.cols p{margin:0 0 .6em;text-indent:1.1em}
.cols p.first{text-indent:0}
.dropcap{float:left;font:900 56px/.8 var(--serif);margin:4px 6px 0 0;padding:2px 4px 0;border:1px solid currentColor;outline:1px solid currentColor;outline-offset:2px}
.notes{break-inside:avoid;border-top:2px solid currentColor;padding-top:6px;margin-top:4px}
.notes h4{font:700 12.5px/1.2 var(--sc);letter-spacing:.14em;text-align:center;margin:6px 0 2px;text-transform:uppercase}
.notes p{text-indent:0;font-size:14.5px;text-align:center;font-style:italic}
.news-foot{display:flex;justify-content:space-between;gap:10px;font:600 11.5px/1.3 var(--sc);letter-spacing:.1em;border-top:3px double currentColor;padding-top:6px;margin-top:12px}
.byline{font:600 13px/1.2 var(--sc);letter-spacing:.14em;text-align:center;margin:0 0 10px;text-transform:uppercase}

/* ================= HERO ================= */
.sec-hero{padding:0;height:max(100svh,700px);max-height:980px;min-height:660px;background:#dfe7f1;isolation:isolate}
.layer{position:absolute;inset:-24px -6% -90px;will-change:transform;pointer-events:none}
.layer svg{width:100%;height:100%}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.petals{position:absolute;inset:0;pointer-events:none;perspective:700px;overflow:hidden;z-index:6}
.petal{position:absolute;left:0;top:0;width:18px;height:18px;will-change:transform}
.petal svg{width:100%;height:100%}
.media-slot{position:absolute;inset:0;z-index:0;pointer-events:none}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.has-video .bg-video{opacity:1}
.has-video .scene-svg{visibility:hidden}
.media-slot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,247,240,.25),rgba(251,247,240,.45));opacity:0;transition:opacity 1s}
.has-video .media-slot::after,.media-slot.has-video::after{opacity:1}
.hero-copy{position:absolute;left:0;right:0;top:25%;z-index:5;text-align:center;padding:0 24px;will-change:transform}
.hero-copy::before{content:"";position:absolute;left:50%;top:44%;width:150%;height:150%;transform:translate(-50%,-50%);background:radial-gradient(ellipse 46% 42% at 50% 50%,rgba(253,249,242,.95) 0%,rgba(253,249,242,.78) 40%,rgba(253,249,242,0) 72%);z-index:-1}
.bless{font:19px/1.4 var(--deva);color:var(--gold-deep);margin:0}
.bless-sub{font:italic 14.5px/1.4 var(--fell);color:var(--ink-soft);margin:2px 0 6px}
.hero-names{font:400 clamp(58px,17vw,82px)/1.2 var(--script);margin:0;color:var(--ink);padding:0 .25em;text-shadow:0 1px 0 rgba(255,255,255,.7),0 0 24px rgba(255,248,235,.9)}
.hero-names .amp{display:block;font:italic 400 .36em/1 var(--serif);color:var(--gold-deep);margin:-6px 0 -2px}
.hero-req{font:italic 18px/1.4 var(--serif);margin:4px 0 12px;color:var(--ink)}
.hero-date{display:inline-block;font:600 16px/1 var(--sc);letter-spacing:.24em;padding:10px 4px 10px 18px;border-top:1px solid var(--gold-lo);border-bottom:1px solid var(--gold-lo);color:var(--ink)}
.scroll-cue{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:7;font:600 12px/1 var(--sc);letter-spacing:.26em;color:var(--ink-soft);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px;padding-left:.26em}
.scroll-cue i{width:1px;height:34px;background:linear-gradient(var(--gold-lo),transparent);animation:cue 2.4s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(.2);opacity:0}40%{opacity:1}100%{transform:scaleY(1);opacity:0}}
.sway{transform-box:fill-box;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.glint{opacity:0;transform-box:fill-box;transform-origin:center}
.wis-sway{transform-box:fill-box;transform-origin:50% 0;animation:wsway 6s ease-in-out infinite alternate}
@keyframes wsway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}

/* ================= COUPLE ================= */
.sec-couple{background-color:#f7e8e6;background-image:var(--grain),radial-gradient(ellipse at 50% 0%,#fbf1ee,transparent 70%)}
.person{margin:34px auto 0;text-align:center;max-width:340px}
.flip{position:relative;width:min(80vw,300px);aspect-ratio:3/4;margin:0 auto;perspective:1400px;cursor:pointer;border:0;background:none;padding:0;display:block}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.3,.1,.2,1.08)}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .side.b{transform:rotateY(180deg)}
.cameo{width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(31,42,68,.25))}

const SVGWRAP = (inner, cls = "scene-svg", vb = "0 0 390 844", ar = "xMidYMid slice") => `<svg class="${cls}" viewBox="${vb}" preserveAspectRatio="${ar}" aria-hidden="true">${inner}</svg>`;

function crackGeometry() {
  const c = [50, 55], angles = [-95, 28, 152], r = rng(17);
  const cracks = angles.map(a => { const pts = [c]; for (let i = 1; i <= 6; i++) { const rr = i * 11, aa = (a + (r() - .5) * 26) * Math.PI / 180; pts.push([f1(c[0] + Math.cos(aa) * rr), f1(c[1] + Math.sin(aa) * rr)]); } return { a, pts }; });
  const pieces = [];
  for (let k = 0; k < 3; k++) {
    const A = cracks[k], B = cracks[(k + 1) % 3]; let a0 = A.a, a1 = B.a; if (a1 < a0) a1 += 360;
    const arc = []; for (let t = 0; t <= 6; t++) { const aa = lerp(a0, a1, t / 6) * Math.PI / 180; arc.push([f1(50 + Math.cos(aa) * 80), f1(50 + Math.sin(aa) * 80)]); }
    const poly = [...A.pts, ...arc, ...B.pts.slice().reverse()];
    const mid = ((a0 + a1) / 2) * Math.PI / 180;
    pieces.push({ clip: `polygon(${poly.map(p => `${p[0]}% ${p[1]}%`).join(",")})`, dir: [Math.cos(mid), Math.sin(mid)] });
  }
  return { cracks, pieces };
}

function floorSVG() {
  const yH = 430, F = 414, K = 58; let s = `<rect x="0" y="620" width="390" height="230" fill="url(#g-floor)"/>`;
  const zs = []; for (let z = 1; yH + F / z > 620; z *= 1.17) zs.push(z); zs.push(F / (620 - yH));
  for (let i = 0; i < zs.length - 1; i++) {
    const z0 = zs[i], z1 = zs[i + 1], yn = yH + F / z0, yf = yH + F / z1;
    for (let j = -8; j < 8; j++) {
      if ((i + j) & 1) continue;
      s += `<path d="M${f1(195 + j * K / z0)},${f1(yn)} L${f1(195 + (j + 1) * K / z0)},${f1(yn)} L${f1(195 + (j + 1) * K / z1)},${f1(yf)} L${f1(195 + j * K / z1)},${f1(yf)}Z" fill="#cfdbe8" opacity=".7"/>`;
    }
  }
  for (let j = -8; j <= 8; j++) s += `<line x1="${f1(195 + j * K)}" y1="844" x2="${f1(195 + j * K / zs[zs.length - 1])}" y2="620" stroke="#c2a15b" stroke-width=".35" opacity=".6"/>`;
  return s;
}

function clipPoly(seed) {
  const r = rng(seed), pts = []; const j = () => f1(r() * 1.6);
  for (let i = 0; i <= 12; i++) pts.push([f1(i / 12 * 100), j()]);
  for (let i = 1; i <= 10; i++) pts.push([f1(100 - r() * 1.4), f1(i / 10 * 100)]);
  for (let i = 11; i >= 0; i--) pts.push([f1(i / 12 * 100), f1(100 - r() * 1.6)]);
  for (let i = 9; i >= 1; i--) pts.push([f1(r() * 1.4), f1(i / 10 * 100)]);
  return `polygon(${pts.map(p => p[0] + "% " + p[1] + "%").join(",")})`;
}

  top.animate([{ transform: P + "rotateX(-180deg)" }, { transform: P + "rotateX(-90deg)", offset: .45 }, { transform: P + "rotateX(7deg)", offset: .82 }, { transform: P + "rotateX(0deg)" }], { duration: 1050, fill: "forwards", easing: ease });

  await wait(620);
  Sound.rustle(.7);
  bot.animate([{ transform: P + "rotateX(180deg)" }, { transform: P + "rotateX(90deg)", offset: .45 }, { transform: P + "rotateX(-6deg)", offset: .82 }, { transform: P + "rotateX(0deg)" }], { duration: 950, fill: "forwards", easing: ease });
  $(".face.front .shade", bot).animate([{ opacity: .7 }, { opacity: .7, offset: .45 }, { opacity: .1, offset: .8 }, { opacity: 0 }], { duration: 950, fill: "forwards" });

}
function closeOpener() {
