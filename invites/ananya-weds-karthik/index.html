<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ananya &amp; Karthik — Wedding Invitation</title>
  <meta name="description" content="With the blessings of our elders, we invite you to our wedding in Madurai on Friday, 5 February 2027.">
  <!-- Link preview for WhatsApp / Instagram / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ananya &amp; Karthik — Wedding Invitation">
  <meta property="og:description" content="With the blessings of our elders, we invite you to our wedding in Madurai on Friday, 5 February 2027.">
  <meta property="og:image" content="https://choprakhushee.github.io/Wedding-Invites/templates/temple-gold/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2A1A12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../templates/temple-gold/temple.css">
</head>
<body class="is-entry" data-elements="../../templates/temple-gold/assets/elements/">

  <!-- 1–2. Entry: light the lamp, then the temple doors open. -->
  <div class="entry" id="entry">
    <div class="entry__sky"></div>

    <div class="temple" aria-hidden="true">
      <div class="doorway">
        <div class="doorway__glow"></div>
        <div class="door door--left"><div class="slot" data-slot="temple-door-left"></div><span class="door__shade"></span></div>
        <div class="door door--right"><div class="slot" data-slot="temple-door-right"></div><span class="door__shade"></span></div>
      </div>
      <div class="slot slot--frame" data-slot="temple-frame"></div>
      <div class="plaque"><span class="plaque__names" data-couple="short"></span></div>
      <div class="sway sway--thoranam"><div class="slot slot--thoranam" data-slot="thoranam"></div></div>
      <div class="sway sway--plant-left"><div class="slot" data-slot="banana-plant-left"></div></div>
      <div class="sway sway--plant-right"><div class="slot" data-slot="banana-plant-right"></div></div>
    </div>

    <div class="entry__dark"></div>
    <div class="entry__light"></div>

    <!-- Above the darkness: the lamp and the bell are visible before the light. -->
    <div class="temple temple--front">
      <div class="bell" id="bell"><div class="slot slot--bell" data-slot="bell"></div></div>
      <button class="bell__tap" id="bell-tap" type="button" data-ui-label="ring_bell"></button>
      <div class="diya" id="diya">
        <span class="diya__glow"></span>
        <div class="slot slot--diya" data-slot="diya"></div>
        <span class="flame" id="flame"><span class="flame__body"></span></span>
      </div>
      <p class="hint hint--light" data-ui="tap_to_light"></p>
      <p class="hint hint--enter"><span data-ui="tap_to_enter"></span></p>
    </div>

    <button class="entry__tap" id="entry-tap" type="button" data-ui-label="tap_to_light"></button>
    <button class="chip entry__skip" id="skip" type="button" data-ui="skip_intro"></button>
  </div>

  <!-- The courtyard frame: pillars, garland, jasmine strands and bells.
       It stays in place while the invitation scrolls through the middle. -->
  <div class="courtyard" id="courtyard" aria-hidden="true">
    <div class="cy-view"><div class="slot" data-slot="temple-view"></div></div>
    <div class="cy-sky" id="sky">
      <span class="cy-rays"></span>
      <span class="cy-cloud cy-cloud--a"></span>
      <span class="cy-cloud cy-cloud--b"></span>
      <span class="cy-water"></span>
    </div>
    <div class="cy-veil" id="veil"></div>
    <div class="cy-pillar cy-pillar--left"><div class="slot" data-slot="pillar-left"></div></div>
    <div class="cy-pillar cy-pillar--right"><div class="slot" data-slot="pillar-right"></div></div>
    <div class="cy-hangings" id="hangings"></div>
    <div class="cy-garland" id="garland"></div>
    <div class="cy-petals" id="petals"></div>
  </div>

  <main class="site" id="site">
    <!-- 3–5. Invocation, greeting and the couple, standing in the courtyard. -->
    <section class="hero" id="couple" aria-labelledby="couple-title">
      <div class="floor" aria-hidden="true">
        <div class="wind floor__plant floor__plant--left" data-kind="plant" data-amp="1.2" data-period="4.6" data-lean="1.6"><div class="slot" data-slot="banana-plant-left"></div></div>
        <div class="wind floor__plant floor__plant--right" data-kind="plant" data-amp="1.2" data-period="5.1" data-lean="1.6"><div class="slot" data-slot="banana-plant-right"></div></div>
        <div class="floor__kolam"><div class="slot" data-slot="kolam"></div></div>
        <div class="floor__flowers" id="floor-flowers"></div>
        <div class="lamp lamp--left"><div class="slot" data-slot="kuthuvilakku"></div></div>
        <div class="slot floor__urli" data-slot="urli"></div>
        <div class="slot floor__lotus" data-slot="lotus"></div>
        <div class="floor__kalasam"><div class="slot" data-slot="kalasam"></div></div>
        <div class="lamp lamp--right"><div class="slot" data-slot="kuthuvilakku"></div></div>
      </div>

      <div class="panel panel--ivory zari hero__panel">
        <p class="invocation__shloka" id="shloka" hidden></p>
        <p class="greeting" id="greeting" hidden></p>
        <p class="kicker" data-ui="wedding_of"></p>
        <h1 class="hero__names" id="couple-title">
          <span class="hero__name" data-person="0"></span>
          <span class="amp">&amp;</span>
          <span class="hero__name" data-person="1"></span>
        </h1>
        <span class="divider" aria-hidden="true"></span>
        <p class="hero__date" data-wedding-date></p>
        <p class="hero__place" id="wedding-place"></p>
        <a class="scroll-hint" href="#families"><span data-ui="scroll_hint"></span><span class="scroll-hint__bud" aria-hidden="true"></span></a>
      </div>
    </section>

    <!-- 4. The families. -->
    <section class="section" id="families">
      <div class="panel panel--ivory zari families reveal">
        <p class="invocation__blessing" id="blessing" hidden></p>
        <p class="kicker" data-ui="together"></p>
        <div class="person">
          <p class="person__name" data-person="0" aria-hidden="true"></p>
          <p class="person__parents" data-parents="0"></p>
        </div>
        <p class="amp" aria-hidden="true">&amp;</p>
        <div class="person">
          <p class="person__name" data-person="1" aria-hidden="true"></p>
          <p class="person__parents" data-parents="1"></p>
        </div>
      </div>
    </section>

    <!-- 6. The muhurtham: the auspicious hour, with a countdown. -->
    <section class="section" id="muhurtham" hidden>
      <div class="panel panel--red zari muhurtham reveal">
        <span class="shimmer" aria-hidden="true"><i></i></span>
        <p class="kicker kicker--gold" data-ui="muhurtham_label"></p>
        <h2 class="muhurtham__time" id="muhurtham-time"></h2>
        <p class="muhurtham__date" id="muhurtham-date"></p>
        <p class="muhurtham__venue" id="muhurtham-venue"></p>
        <div class="countdown" id="countdown" hidden>
          <p class="countdown__title" data-ui="countdown_title"></p>
          <div class="countdown__grid">
            <div><span data-unit="days">0</span><small data-ui="days"></small></div>
            <div><span data-unit="hours">0</span><small data-ui="hours"></small></div>
            <div><span data-unit="minutes">0</span><small data-ui="minutes"></small></div>
            <div><span data-unit="seconds">0</span><small data-ui="seconds"></small></div>
          </div>
        </div>
        <p class="countdown__done" id="countdown-done" data-ui="married" hidden></p>
      </div>
    </section>

    <!-- 7. The events, each with directions and a calendar file. -->
    <section class="section events" id="events" aria-labelledby="events-title">
      <h2 class="plaque-title reveal" id="events-title"><span data-ui="celebrations"></span></h2>
      <div class="events__list" id="events-list"></div>
    </section>

    <!-- 11. Closing blessing. -->
    <section class="section closing" id="closing">
      <div class="panel panel--ivory zari closing__panel reveal">
        <p class="kicker" data-ui="closing_title"></p>
        <p class="closing__blessing" id="closing-blessing"></p>
        <span class="divider" aria-hidden="true"></span>
        <p class="closing__names" data-couple="long"></p>
        <p class="closing__families" id="closing-families"></p>
      </div>
      <p class="credit" id="credit" hidden></p>
    </section>
  </main>

  <!-- Floating controls -->
  <div class="controls">
    <button class="chip" id="lang" type="button" hidden></button>
    <button class="fab" id="music" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="fab__slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <audio id="audio" loop preload="none"></audio>

  <script src="../../templates/shared/vendor/gsap.min.js"></script>
  <script src="../../templates/shared/core.js"></script>
  <script src="../../templates/temple-gold/motifs.js"></script>
  <script src="../../templates/temple-gold/motifs-courtyard.js"></script>
  <script src="../../templates/temple-gold/courtyard.js"></script>
  <script src="../../templates/temple-gold/temple.js"></script>
</body>
</html>
