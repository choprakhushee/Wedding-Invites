<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ananya &amp; Karthik — Wedding Invitation</title>
  <meta name="description" content="With the blessings of our elders, we invite you to our wedding in Madurai on Friday, 5 February 2027.">
  <!-- Link preview for WhatsApp / Instagram / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ananya &amp; Karthik — Wedding Invitation">
  <meta property="og:description" content="With the blessings of our elders, we invite you to our wedding in Madurai on Friday, 5 February 2027.">
  <meta property="og:image" content="https://choprakhushee.github.io/Wedding-Invites/templates/temple-gold/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2A1A12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../templates/temple-gold/temple.css">
</head>
<body class="is-entry" data-elements="../../templates/temple-gold/assets/elements/">

  <!-- 1–2. Entry: light the lamp, then the temple doors open. -->
  <div class="entry" id="entry">
    <div class="entry__sky"></div>

    <div class="temple" aria-hidden="true">
      <div class="slot slot--gopuram" data-slot="gopuram"></div>
      <div class="slot slot--frame" data-slot="temple-frame"></div>
      <div class="doorway">
        <div class="doorway__glow"></div>
        <div class="door door--left"><div class="slot" data-slot="temple-door-left"></div><span class="door__shade"></span></div>
        <div class="door door--right"><div class="slot" data-slot="temple-door-right"></div><span class="door__shade"></span></div>
      </div>
      <div class="plaque"><span class="plaque__names" data-couple="short"></span></div>
      <div class="sway sway--thoranam"><div class="slot slot--thoranam" data-slot="thoranam"></div></div>
      <div class="sway sway--leaf-left"><div class="slot slot--leaf" data-slot="banana-leaf-left"></div></div>
      <div class="sway sway--leaf-right"><div class="slot slot--leaf" data-slot="banana-leaf-right"></div></div>
    </div>

    <div class="entry__dark"></div>
    <div class="entry__light"></div>

    <!-- Above the darkness: the lamp and the bell are visible before the light. -->
    <div class="temple temple--front">
      <div class="bell" id="bell"><div class="slot slot--bell" data-slot="bell"></div></div>
      <button class="bell__tap" id="bell-tap" type="button" data-ui-label="ring_bell"></button>
      <div class="diya" id="diya">
        <span class="diya__glow"></span>
        <div class="slot slot--diya" data-slot="diya"></div>
        <span class="flame" id="flame"><span class="flame__body"></span></span>
      </div>
      <p class="hint hint--light" data-ui="tap_to_light"></p>
      <p class="hint hint--enter"><span data-ui="tap_to_enter"></span></p>
    </div>

    <button class="entry__tap" id="entry-tap" type="button" data-ui-label="tap_to_light"></button>
    <button class="chip entry__skip" id="skip" type="button" data-ui="skip_intro"></button>
  </div>

  <main class="site" id="site">
    <!-- 4. Couple reveal (first pass; the kolam and parents' lines come next). -->
    <section class="couple" id="couple" aria-labelledby="couple-names">
      <div class="panel panel--ivory couple__panel">
        <p class="kicker" data-ui="wedding_of"></p>
        <h1 class="couple__names" id="couple-names" data-couple="long"></h1>
        <p class="couple__date" data-wedding-date></p>
      </div>
    </section>
  </main>

  <!-- Floating controls -->
  <div class="controls">
    <button class="chip" id="lang" type="button" hidden></button>
    <button class="fab" id="music" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="fab__slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <audio id="audio" loop preload="none"></audio>

  <script src="../../templates/shared/vendor/gsap.min.js"></script>
  <script src="../../templates/shared/core.js"></script>
  <script src="../../templates/temple-gold/motifs.js"></script>
  <script src="../../templates/temple-gold/temple.js"></script>
</body>
</html>
