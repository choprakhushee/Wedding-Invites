<style>
:root{
  --ivory:#FBF6EF; --blush:#F2D4D0; --rose:#C98A8F; --rose-deep:#A4626B; --peony:#E7A8B3;
  --sage:#A8B89B; --leaf:#4F6B4A; --gold:#C9A65A; --gold-deep:#8C6B2F; --ink:#4A3B3A; --ink-soft:#6E5A57;
  --foil:linear-gradient(100deg,#B08D45 0%,#EAD7A0 38%,#C9A65A 55%,#EAD7A0 72%,#B08D45 100%);
  --col:480px;
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .42 0 0 0 0 .34 0 0 0 0 .3 0 0 0 .16 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:#F4E4DE;color:var(--ink);font:400 18px/1.55 "Cormorant Garamond",Georgia,serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh;height:100svh}
img,svg{display:block;max-width:100%}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- desktop backdrop ---------- */
#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(60% 50% at 15% 20%,rgba(242,212,208,.9),transparent 70%),
             radial-gradient(50% 45% at 85% 80%,rgba(168,184,155,.35),transparent 70%),
             radial-gradient(40% 40% at 90% 10%,rgba(231,168,179,.35),transparent 70%),
             linear-gradient(160deg,#F7ECE6,#F1E2DB)}
#backdrop::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.8}
#backdrop svg{position:absolute;width:min(44vw,640px);height:auto;opacity:.75;filter:saturate(.9)}
#backdrop .b1{left:-6vw;top:-8vh}
#backdrop .b2{right:-6vw;bottom:-10vh;transform:rotate(180deg)}
#backdrop .b3{right:-8vw;top:-6vh;transform:scaleX(-1);width:min(30vw,440px);opacity:.55}
#backdrop .b4{left:-8vw;bottom:-8vh;transform:scaleY(-1);width:min(30vw,440px);opacity:.55}
@media (max-width:560px){#backdrop svg{display:none}}

/* ---------- invite column ---------- */
.invite{position:relative;z-index:1;max-width:var(--col);margin:0 auto;background:var(--ivory);overflow:hidden;
  box-shadow:0 0 0 1px rgba(201,166,90,.18),0 30px 80px -20px rgba(120,70,70,.28)}
.invite::before{content:"";position:absolute;inset:0;background:var(--grain);pointer-events:none;z-index:5;mix-blend-mode:multiply;opacity:.9}
.sec{position:relative;padding:84px 22px;text-align:center}
.wash{position:absolute;pointer-events:none;border-radius:50%;filter:blur(30px);opacity:.55}
.label{display:block;font:400 11px/1.6 Montserrat,system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--leaf);padding-left:.25em}
.h2{margin:10px 0 0;font:italic 500 clamp(34px,9.5vw,42px)/1.12 "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.script{font-family:Parisienne,cursive;font-weight:400;line-height:1.35;padding:0 .18em;color:var(--rose-deep)}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-dark{background:linear-gradient(100deg,#8C6B2F,#B08D45 40%,#9C7A38 60%,#8C6B2F);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:14px auto 0;max-width:34ch;font-size:19px;color:var(--ink-soft);font-style:italic}
.divider{width:220px;height:36px;margin:22px auto 0}
.rule{display:flex;align-items:center;justify-content:center;gap:14px}
.rule::before,.rule::after{content:"";height:1px;width:46px;background:linear-gradient(90deg,transparent,#C9A65A,transparent)}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease-out,transform 1s ease-out;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* sway */
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--dur,7s) ease-in-out var(--del,0s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--amp,1.6deg) * -1))}to{transform:rotate(var(--amp,1.6deg))}}
.swh{transform-box:fill-box;transform-origin:50% 0;animation:sway var(--dur,8s) ease-in-out var(--del,0s) infinite alternate}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:12px 20px;border-radius:999px;
  font:500 11px/1 Montserrat,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  border:1px solid rgba(164,98,107,.45);background:rgba(251,246,239,.85);color:var(--rose-deep);transition:background .4s,color .4s,box-shadow .4s}
.btn:hover,.btn:focus-visible{background:#fff;box-shadow:0 8px 22px -10px rgba(164,98,107,.55)}
.btn svg{width:16px;height:16px;flex:none}
.btn-solid{background:linear-gradient(135deg,#D29AA0,#B66F79);color:#fff;border-color:transparent;box-shadow:0 14px 30px -14px rgba(164,98,107,.8)}
.btn-solid:hover,.btn-solid:focus-visible{background:linear-gradient(135deg,#C98A8F,#A4626B);color:#fff}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}

/* ---------- opener ---------- */
#opener{position:fixed;top:0;bottom:0;left:50%;width:min(100%,var(--col));transform:translateX(-50%);z-index:60;perspective:1500px;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;outline:none}
#opener .door{position:absolute;top:0;bottom:0;width:50.4%;transition:transform 2.6s cubic-bezier(.45,.05,.25,1),opacity 1s ease 1.7s;will-change:transform;backface-visibility:hidden}
#opener .door svg{width:100%;height:100%}
#opener .door.l{left:0;transform-origin:0 50%;box-shadow:inset -6px 0 12px -6px rgba(110,60,60,.35)}
#opener .door.r{right:0;transform-origin:100% 50%;box-shadow:inset 6px 0 12px -6px rgba(110,60,60,.35)}
#opener.open .door.l{transform:rotateY(96deg);opacity:0}
#opener.open .door.r{transform:rotateY(-96deg);opacity:0}
#opener .invite-tag{position:absolute;left:50%;top:max(7svh,44px);transform:translateX(-50%);width:min(84%,330px);padding:20px 18px 18px;text-align:center;
  background:radial-gradient(closest-side,rgba(251,246,239,.97) 70%,rgba(251,246,239,.9));border-radius:160px 160px 14px 14px;
  box-shadow:0 16px 40px -16px rgba(110,60,60,.45),inset 0 0 0 1px rgba(201,166,90,.55),inset 0 0 0 5px rgba(251,246,239,.9),inset 0 0 0 6px rgba(201,166,90,.35);
  transition:opacity .7s ease,transform .9s ease}
#opener .invite-tag .label{font-size:10px;color:var(--leaf)}
#opener .invite-tag p{margin:6px 0 0;font:italic 500 25px/1.2 "Cormorant Garamond",serif;color:var(--ink)}
#opener .invite-tag .dear{display:block;font-family:Parisienne,cursive;font-style:normal;font-size:33px;line-height:1.3;color:var(--rose-deep);padding:0 .2em}
#opener .seal{position:absolute;left:50%;top:54%;width:min(64vw,250px);aspect-ratio:1;transform:translate(-50%,-50%);transition:opacity .7s ease,transform 1s cubic-bezier(.4,0,.2,1)}
#opener .seal .disc{position:absolute;inset:19%;border-radius:50%;background:radial-gradient(circle,#FFFDF9 55%,#F8EDE6);box-shadow:0 10px 30px -10px rgba(110,60,60,.5),inset 0 0 0 1px rgba(201,166,90,.6),inset 0 0 0 4px #FFFDF9,inset 0 0 0 5px rgba(201,166,90,.35)}
#opener .seal svg.wr{position:absolute;inset:0;width:100%;height:100%}
#opener .seal .mono{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2%}
#opener .mono b{font:400 clamp(40px,12vw,50px)/1.25 Parisienne,cursive;padding:0 .15em}
#opener .mono span{margin-top:2px;font:500 9.5px/1 Montserrat,sans-serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--leaf);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
#opener.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.15)}
#opener.open .invite-tag{opacity:0;transform:translate(-50%,-12px)}
#opener.gone{opacity:0;transition:opacity .6s ease;pointer-events:none}

/* ---------- music ---------- */
#music{position:fixed;z-index:55;top:calc(12px + env(safe-area-inset-top));right:max(12px,calc(50% - var(--col)/2 + 12px));width:48px;height:48px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#FFFDF9,#F6E6E1);box-shadow:0 8px 22px -8px rgba(110,60,60,.45),inset 0 0 0 1px rgba(201,166,90,.6);opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}
#music.show{opacity:1;visibility:visible}
#music svg{width:100%;height:100%}
#music .rs{transform-origin:50% 50%;transition:opacity .5s}
#music.on .rs{animation:spin 14s linear infinite}
#music:not(.on) .rs{opacity:.55;filter:grayscale(.6)}
#music .bar{opacity:0;transition:opacity .4s}
#music:not(.on) .bar{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

#petals{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}

/* ---------- hero ---------- */
.hero{padding:58px 0 70px;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#F8E3DE 0%,rgba(251,246,239,0) 70%)}
.hero .corner{position:absolute;width:46%;max-width:210px;pointer-events:none;z-index:1}
.hero .corner.tl{left:-7%;top:-4%}
.hero .corner.tr{right:-7%;top:-4%;transform:scaleX(-1)}
.blessing{position:relative;z-index:2;margin:0 auto;max-width:62%;}
.blessing .dev{font:400 21px/1.5 "Tiro Devanagari Hindi",serif;color:var(--rose-deep);letter-spacing:.02em}
.blessing .sub{display:block;margin-top:2px;font:400 9.5px/1.7 Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);padding-left:.22em}
.arch-wrap{position:relative;margin:30px auto 0;width:min(100%,430px)}
.arch-wrap > svg{width:100%;height:auto;overflow:visible}
.names{position:relative;z-index:2;margin:-6px 0 0;font-size:clamp(64px,19vw,84px);line-height:1.3}
.names .amp{font-size:.62em;vertical-align:.12em;color:var(--gold)}
.getting{margin:-6px 0 0;font:italic 400 22px/1.3 "Cormorant Garamond",serif;color:var(--ink-soft)}
.date-line{margin-top:20px;font:400 12.5px/1 Montserrat,sans-serif;letter-spacing:.3em;color:var(--ink);padding-left:.3em}
.date-line i{font-style:normal;color:var(--gold);margin:0 .35em}
.scroll-cue{display:block;margin:32px auto 0;width:22px;height:34px;border-radius:12px;border:1px solid rgba(164,98,107,.45);position:relative}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--rose);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(10px)}}

/* ---------- couple ---------- */
.couple{background:linear-gradient(180deg,rgba(242,212,208,0),rgba(242,212,208,.35) 50%,rgba(242,212,208,0))}
.invitation-line{margin:18px auto 0;max-width:31ch;font:italic 400 20px/1.5 "Cormorant Garamond",serif;color:var(--ink-soft)}
.pair{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:14px;margin:34px -8px 0}
.person svg.frame{width:100%;height:auto;overflow:visible}
.person h3{margin:4px 0 0;font-size:clamp(25px,7.2vw,31px);line-height:1.35;white-space:nowrap}
.person .of{display:block;font:400 9px/1.6 Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);margin-top:2px}
.person .parents{text-wrap:balance;margin:4px 0 0;font:italic 400 16px/1.35 "Cormorant Garamond",serif;color:var(--ink-soft)}
.person .city{display:block;margin-top:6px;font:400 9px/1 Montserrat,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-deep)}
.pair .mid{position:absolute;z-index:2;left:50%;top:clamp(70px,20vw,96px);width:66px;height:66px;margin-left:-33px;border-radius:50%;background:radial-gradient(circle,#FFFDF9 58%,rgba(255,253,249,0) 72%)}
.pair .mid svg{width:100%;height:100%;overflow:visible}
.bloom-frame .bl{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);opacity:0;transition:transform 1.4s cubic-bezier(.2,.7,.25,1) var(--d,0s),opacity .9s ease var(--d,0s)}
.bloom-frame.in .bl{transform:scale(1);opacity:1}
.bloom-frame .vine-draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s ease-out}
.bloom-frame.in .vine-draw{stroke-dashoffset:0}

/* ---------- countdown ---------- */
.countdown{padding-top:70px;padding-bottom:40px}
.wreaths{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:30px -6px 0}
.wreath-num{position:relative;aspect-ratio:1}
.wreath-num svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wreath-num .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wreath-num b{font:500 clamp(24px,7vw,32px)/1 "Cormorant Garamond",serif;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.wreath-num small{margin-top:4px;font:400 7.5px/1 Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);padding-left:.2em}
.married{font-size:52px;margin-top:20px}
.count-note{margin-top:18px;font:italic 400 17px/1.4 "Cormorant Garamond",serif;color:var(--ink-soft)}

/* ---------- story ---------- */
.timeline{position:relative;margin:40px auto 0;max-width:400px;text-align:left}
.timeline > svg.vine{position:absolute;left:0;top:0;width:70px;height:100%;overflow:visible;pointer-events:none}
.chapter{position:relative;padding:0 0 54px 86px;min-height:120px}
.chapter:last-child{padding-bottom:6px}
.chapter .stage{position:absolute;left:-1px;top:-8px;width:72px;height:72px}
.chapter .stage svg{width:100%;height:100%;overflow:visible}
.chapter .stage .grow{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.25,1) .2s,opacity 1s ease .2s}
.chapter.in .stage .grow{transform:scale(1);opacity:1}
.chapter .meta{font:400 10px/1.5 Montserrat,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep)}
.chapter h3{margin:2px 0 6px;font:italic 500 30px/1.15 "Cormorant Garamond",serif;color:var(--ink)}
.chapter p{margin:0;font-size:18px;line-height:1.55;color:var(--ink-soft)}

/* ---------- events ---------- */
.events{display:grid;gap:30px;margin-top:38px}
.event{position:relative;border-radius:180px 180px 22px 22px;padding:14px 20px 30px;background:linear-gradient(180deg,var(--tint) 0%,rgba(251,246,239,.96) 58%);
  box-shadow:0 22px 50px -30px rgba(110,60,60,.5),inset 0 0 0 1px rgba(201,166,90,.45),inset 0 0 0 6px rgba(251,246,239,.75),inset 0 0 0 7px rgba(201,166,90,.25);overflow:hidden}
.event .arch{width:calc(100% + 40px);margin:0 -20px;height:auto;overflow:visible}
.event .tag{margin-top:-6px;font:500 10.5px/1.6 Montserrat,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-ink);padding-left:.28em}
.event h3{margin:2px 0 0;font-size:54px;line-height:1.3;color:var(--accent-ink)}
.event dl{margin:12px auto 0;display:grid;gap:10px;max-width:300px}
.event dl div{display:grid;gap:1px}
.event dt{font:400 9.5px/1.4 Montserrat,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);padding-left:.24em}
.event dd{margin:0;font:500 19px/1.35 "Cormorant Garamond",serif;color:var(--ink)}
.event .swatches{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.event .swatches i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(74,59,58,.2)}
.event .acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.event .acts .btn{width:100%;max-width:260px;white-space:nowrap}

/* ---------- venue ---------- */
.venue-scene{margin:30px -22px 0;position:relative}
.venue-scene svg{width:100%;height:auto}
.mist{animation:drift 26s ease-in-out infinite alternate}
.mist.m2{animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(26px)}}
.venue-name{margin:20px 0 0;font:italic 500 26px/1.25 "Cormorant Garamond",serif}
.venue-addr{margin:4px 0 22px;font:400 10px/1.7 Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);padding-left:.22em}

/* ---------- rsvp ---------- */
.rsvp-card{position:relative;margin:8px auto 0;max-width:400px;padding:84px 26px 64px;border-radius:16px;background:radial-gradient(120% 80% at 50% 0%,#FFFDF9,#FBF2EE);
  box-shadow:0 26px 60px -34px rgba(110,60,60,.6),inset 0 0 0 1px rgba(201,166,90,.55),inset 0 0 0 7px #FFFDF9,inset 0 0 0 8px rgba(201,166,90,.3)}
.rsvp-card .cb{position:absolute;width:136px;pointer-events:none}
.rsvp-card .cb.tl{left:-24px;top:-28px}
.rsvp-card .cb.br{right:-24px;bottom:-28px;transform:rotate(180deg)}
.rsvp-card .h2{font-size:clamp(30px,8.4vw,36px)}
.rsvp-card .by{margin:12px 0 0;font:italic 500 25px/1.3 "Cormorant Garamond",serif}
.rsvp-card .by b{font-weight:600;color:var(--rose-deep)}
.rsvp-card .note{margin:10px auto 0;max-width:28ch;font-size:18px;color:var(--ink-soft)}
.btn-rsvp{margin-top:26px;min-height:58px;padding:16px 28px;font-size:12px;width:100%;max-width:300px}
.btn-rsvp svg{width:20px;height:20px}
.contacts{margin:32px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.contacts li{display:grid;gap:2px}
.contacts .who{font:italic 500 21px/1.2 "Cormorant Garamond",serif}
.contacts .rel{font:400 9.5px/1.5 Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--leaf);padding-left:.22em}
.contacts a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin:0 auto;padding:0 14px;font:500 13px/1 Montserrat,sans-serif;letter-spacing:.12em;color:var(--rose-deep);text-decoration:none;border-bottom:1px solid rgba(201,166,90,.6)}
.contacts a svg{width:14px;height:14px}

/* ---------- sign-off ---------- */
.signoff{padding-bottom:40px;background:linear-gradient(180deg,rgba(242,212,208,0),rgba(242,212,208,.55))}
.sign-wreath{width:min(78%,280px);margin:0 auto}
.sign-wreath svg{width:100%;height:auto;overflow:visible}

/* ---------- og card mode ---------- */
body.og{background:#fff;margin:0}
body.og #og{display:block;width:1200px;height:630px}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .sw,.swh,.mist,#music.on .rs,.scroll-cue::after,#opener .mono span{animation:none!important}
  .rv{transform:none;transition:opacity 1.2s ease}
  #opener .door{transition:opacity 1.4s ease!important}
  #opener.open .door.l,#opener.open .door.r{transform:none}
  .bloom-frame .bl,.chapter .stage .grow{transform:none;transition:opacity 1.2s ease}
  .bloom-frame .vine-draw{stroke-dashoffset:0}
  #petals{display:none}
}
@media (min-width:600px){ .sec{padding-left:30px;padding-right:30px} .venue-scene{margin-left:-30px;margin-right:-30px} }

function portraitFrame(who, seed, flip) {
  const R = rng(seed), cx = 80, cy = 104, rx = 62, ry = 84;
  let ring = "", fl = "";
  for (let a = 0; a < 360; a += 11) { const x = cx + (rx + 3) * Math.cos(a * DEG), y = cy + (ry + 3) * Math.sin(a * DEG), tg = a + 90 + (flip ? 180 : 0);
    ring += place(x, y, tg - 30 + R() * 20, leaf(13 + R() * 6, 3.6, a % 22 ? "leaf" : "sage"), { cls: "bl", style: `--d:${f1(.2 + (a / 360) * 1.6)}s` }); }
  const at = (a, k = 1) => [cx + (rx + 4) * k * Math.cos(a * DEG), cy + (ry + 4) * k * Math.sin(a * DEG)];
  const sets = flip ? [[60, "peony", 22, "peony"], [82, "rose", 15, "white"], [38, "rose", 13, "dusty"], [104, "ranunculus", 10, "peach"], [-120, "rose", 13, "blush"], [-140, "rose", 9, "white"]]
                    : [[120, "peony", 22, "peony"], [98, "rose", 15, "white"], [142, "rose", 13, "dusty"], [76, "ranunculus", 10, "peach"], [-60, "rose", 13, "blush"], [-40, "rose", 9, "white"]];
  sets.forEach(([a, t, r, p], i) => { const [x, y] = at(a); fl += place(x, y, 0, bloom(t, r, R, p), { cls: "bl", style: `--d:${f1(.6 + i * .18)}s` }); });
  const crop = who === "bride" ? "193 86 114 155" : "100 66 118 160";
  return `<svg class="frame bloom-frame" viewBox="-8 -6 176 222" role="img" aria-label="Portrait of ${esc(who === "bride" ? B.full : G.full)}">
    <defs><clipPath id="oval-${who}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath></defs>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#sky)"/>
    <g clip-path="url(#oval-${who})" id="portrait-${who}"><circle cx="${cx}" cy="${cy - 20}" r="50" fill="url(#glow)"/><svg x="${cx - rx}" y="${cy - ry}" width="${rx * 2}" height="${ry * 2}" viewBox="${crop}" preserveAspectRatio="xMidYMid slice"><use href="#s-${who}"/></svg></g>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx + 1}" ry="${ry + 1}" fill="none" stroke="url(#gold)" stroke-width="1.3" class="vine-draw" pathLength="1"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx - 4}" ry="${ry - 4}" fill="none" stroke="url(#gold)" stroke-width=".5" opacity=".6"/>
    <g filter="url(#wc)">${ring}${fl}</g>
  </svg>`;
}

function eventArch(ev, i) {
  const A = { cx: 160, R: 128, spring: 152, base: 300, leaf: 19, leafStep: .02 };
  const t = ev.type, pals = { rose: ["rose", "white", "dusty"], jasmine: [], marigold: [], orchid: [], lily: [] }[t] || [];
  const k = t === "jasmine" ? 1.25 : t === "marigold" ? .95 : t === "orchid" ? 1.05 : t === "lily" ? 1.15 : 1;
  const cl = [
    { t: .03, r: 30 * k, dy: -10, pal: pals[0] }, { t: .1, r: 19 * k, pal: pals[1] },
    { t: .3, r: 20 * k, sway: 1, pal: pals[1] }, { t: .36, r: 30 * k, sway: 1, pal: pals[0] }, { t: .425, r: 18 * k, sway: 1, pal: pals[2] },
    { t: .5, r: 12 * k, sway: 1, pal: pals[1] },
    { t: .64, r: 24 * k, sway: 1, pal: pals[2] }, { t: .7, r: 16 * k, sway: 1, pal: pals[1] },
    { t: .97, r: 28 * k, dy: -10, pal: pals[1] }, { t: .9, r: 18 * k, pal: pals[0] }
  ].map(c => ({ ...c, type: t }));
  const fr = archFrame(A, 100 + i * 17, cl);
  const R = rng(500 + i), hero = bloom(t, t === "jasmine" ? 76 : t === "orchid" ? 56 : t === "lily" ? 62 : t === "marigold" ? 52 : 52, R, t === "rose" ? "rose" : undefined);

    for (let k = 0; k < 3; k++) { const d = R() * 360, L = 30 + R() * 30; leaves += leafAt(x + Math.cos(d * DEG) * 14, y + Math.sin(d * DEG) * 14, d, L, L * .26, R() > .4 ? "leaf" : "sage"); }

/* ---------- reveal on scroll ---------- */
function reveals() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: .12 });
  $$(".rv").forEach(el => { if (!el.closest("#hero")) io.observe(el); });
  $$(".sign-wreath svg, #wreaths svg, .mid svg").forEach(el => el.classList.add("bloom-frame"));
  const io2 = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io2.unobserve(e.target); } }), { threshold: .3 });
  $$(".bloom-frame, .chapter").forEach(el => io2.observe(el));
}

/* ---------- countdown ---------- */
function countdown() {
  const target = new Date(C.countdown.target).getTime(), cells = $$("#wreaths b");

    if (d <= 0) { $("#wreaths").outerHTML = `<p class="married script rv in">${esc(C.countdown.after)}</p>`; return clearInterval(iv); }
    const v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
    v.forEach((n, i) => { const t = String(n).padStart(2, "0"); if (cells[i].textContent !== t) cells[i].textContent = t; });
  };
  const iv = setInterval(tick, 1000); tick();
}

  const tl = $("#timeline"), svg = $("svg.vine", tl); let path, len = 0, leaves = [];

    const R = rng(4); let lv = "";

    svg.setAttribute("viewBox", `0 0 70 ${h}`); svg.style.height = h + "px";

    path = svg.querySelector("path"); len = path.getTotalLength(); path.style.strokeDasharray = len; leaves = $$(".vl", svg); update();
  };

/* ---------- calendar (.ics) ---------- */
function icsFor(e) {
  const start = fmtDate(e.date, e.time), end = new Date(start.getTime() + (e.hours || 3) * 36e5);
  const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const x = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const fold = l => { const out = []; while (l.length > 70) { out.push(l.slice(0, 70)); l = " " + l.slice(70); } out.push(l); return out.join("\r\n"); };
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Aamantran Atelier//Wedding Invite//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    `UID:${`${e.date}-${e.name}-${B.first}-${G.first}`.toLowerCase().replace(/[^a-z0-9-]+/g, "")}@aamantran-atelier`, `DTSTAMP:${z(new Date())}`, `DTSTART:${z(start)}`, `DTEND:${z(end)}`,
    `SUMMARY:${x(`${e.name} · ${B.first} & ${G.first}`)}`, `LOCATION:${x(`${e.venue}, ${C.venue.name}, ${C.venue.address.replace(/ · /g, ", ")}`)}`,
    `DESCRIPTION:${x(`${e.name} (${e.flower}) for ${B.first} & ${G.first}'s wedding.\nDress code: ${e.dress}\nMap: ${e.map}`)}`, `URL:${x(e.map)}`,
    "BEGIN:VALARM", "TRIGGER:-PT3H", "ACTION:DISPLAY", `DESCRIPTION:${x(e.name)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"];
  return lines.map(fold).join("\r\n") + "\r\n";
}
function calendarButtons() {
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-ics]"); if (!b) return;
    const e = C.events[+b.dataset.ics], blob = new Blob([icsFor(e)], { type: "text/calendar;charset=utf-8" }), url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${B.first}-${G.first}-${e.name}.ics`.toLowerCase(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });
}

/* ---------- parallax + scroll loop ---------- */
function scrollLoop(storyUpdate) {
  const pars = REDUCED ? [] : $$("[data-par]"); let ticking = false;
  const run = () => { ticking = false; const y = Math.min(scrollY, innerHeight * 1.2); pars.forEach(el => { const k = +el.dataset.par; el.style.transform = `translate3d(0,${f1(y * k)}px,0)${el.classList.contains("tr") ? " scaleX(-1)" : ""}`; }); storyUpdate(); };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true }); run();
}

/* =====================================================================
   Petals — canvas particles (pink & white, tumbling)
   ===================================================================== */
const Petals = (() => {
  const cv = $("#petals"), ctx = cv.getContext("2d"); let W, H, dpr, list = [], raf = 0, last = 0, running = false;
  const cols = [["#F6D3D8", "#E7A8B3"], ["#FFFFFF", "#F2E6E0"], ["#F9E1E0", "#EDB3BE"], ["#FFF8F5", "#F2D4D0"], ["#F2C4CB", "#D88C9B"]];
  const sprites = cols.map(([a, b]) => { const c = document.createElement("canvas"); c.width = 48; c.height = 48; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 4, 0, 44); g.addColorStop(0, a); g.addColorStop(1, b); x.fillStyle = g; x.translate(24, 44);
    x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(-20, -8, -18, -34, -4, -40); x.quadraticCurveTo(0, -36, 4, -40); x.bezierCurveTo(18, -34, 20, -8, 0, 0); x.fill();
    x.globalAlpha = .35; x.strokeStyle = b; x.lineWidth = 1; x.stroke(); return c; });
  const target = () => innerWidth < 600 ? 12 : 24;
  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const make = (x, y, vx, vy, life) => ({ x, y, vx, vy, s: 9 + Math.random() * 9, r: Math.random() * 6.28, vr: (Math.random() - .5) * 1.4, f: Math.random() * 6.28, vf: 1 + Math.random() * 2, sw: Math.random() * 6.28, img: sprites[(Math.random() * sprites.length) | 0], life, age: 0, a: .55 + Math.random() * .35 });
  const spawn = top => make(Math.random() * W, top ? -20 : Math.random() * H, 0, 18 + Math.random() * 22, 0);
  const frame = t => {
    const dt = Math.min(.05, (t - last) / 1000 || .016); last = t; ctx.clearRect(0, 0, W, H);
    const ambient = list.filter(p => !p.life).length; if (ambient < target() && Math.random() < .03) list.push(spawn(true));
    list = list.filter(p => {
      p.age += dt; p.sw += dt * .9; p.f += dt * p.vf; p.r += dt * p.vr;
      if (p.life) { p.vx *= .985; p.vy = p.vy * .985 + 30 * dt; } p.x += (p.vx + Math.sin(p.sw) * 16) * dt; p.y += p.vy * dt;
      let alpha = p.a; if (p.life) { alpha *= Math.max(0, 1 - p.age / p.life); if (p.age > p.life) return false; }
      if (p.y > H + 30 || p.x < -40 || p.x > W + 40) return false;
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(Math.cos(p.f) * .9 + .1 * Math.sign(Math.cos(p.f) || 1), 1);

    });

  };
  const start = () => { if (REDUCED || running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); };
  const stop = () => { running = false; cancelAnimationFrame(raf); };
  resize(); addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : (Petals.active && start()));
  return {
    active: false,
    begin() { if (REDUCED) return; this.active = true; for (let i = 0; i < target() * .6; i++) list.push(spawn(false)); start(); },
    burst() { if (REDUCED) return; const cx = W / 2, cy = H * .52; for (let i = 0; i < (W < 600 ? 34 : 50); i++) { const a = Math.random() * 6.28, sp = 90 + Math.random() * 260; list.push(make(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp - 120, 2.6 + Math.random() * 1.8)); } this.begin(); }
  };
})();

/* =====================================================================
   Music — a soft music-box & felt-piano lullaby (Web Audio API)
   F major pentatonic melody over warm pad chords, ~70 bpm, with reverb.
   ===================================================================== */
const Music = (() => {
  let ctx, master, dry, wet, timer, nextBar = 0, bar = 0, on = false;
  const BPM = C.music.bpm, beat = 60 / BPM, barLen = beat * 4, VOL = C.music.volume;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[53, 57, 60, 65], [50, 57, 62, 65], [46, 53, 58, 62], [48, 55, 60, 64], [53, 57, 60, 65], [45, 52, 57, 60], [46, 53, 58, 62], [48, 55, 60, 65]];
  const BASS = [41, 38, 34, 36, 41, 33, 34, 36];
  const M = [ // [beat, midi, beats] — F major pentatonic (F G A C D)
    [[0, 72, 1], [1, 69, .5], [1.5, 72, .5], [2, 77, 1.5], [3.5, 74, .5]], [[0, 74, 1], [1, 72, .5], [1.5, 69, .5], [2, 74, 2]],
    [[0, 77, 1], [1, 74, 1], [2, 72, .5], [2.5, 74, .5], [3, 77, 1]], [[0, 79, 1.5], [1.5, 77, .5], [2, 74, 1], [3, 72, 1]],
    [[0, 81, 1], [1, 79, .5], [1.5, 77, .5], [2, 72, 1.5], [3.5, 74, .5]], [[0, 72, 1], [1, 69, 1], [2, 67, .5], [2.5, 69, .5], [3, 72, 1]],
    [[0, 74, 1], [1, 77, 1], [2, 79, 1], [3, 77, .5], [3.5, 74, .5]], [[0, 72, 2], [2, 67, 1], [3, 69, 1]]
  ];
  function impulse(sec = 3.4) {
    const n = ctx.sampleRate * sec, buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); let lp = 0; for (let i = 0; i < n; i++) { const t = i / n; lp += (Math.random() * 2 - 1 - lp) * .22; d[i] = lp * Math.pow(1 - t, 2.6) * (i < 400 ? i / 400 : 1); } }
    return buf;
  }
  function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }
  function voice(type, f, t, peak, dec, cut, sendWet = .5, a = .006) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = type; o.frequency.value = f; lp.type = "lowpass"; lp.frequency.value = cut; lp.Q.value = .4;
    o.connect(lp); lp.connect(g); g.connect(dry); const s = ctx.createGain(); s.gain.value = sendWet; g.connect(s); s.connect(wet);
    env(g, t, a, peak, dec); o.start(t); o.stop(t + a + dec + .1);
  }
  const musicBox = (m, t, v = 1) => { voice("sine", mf(m), t, .085 * v, 2.2, 6000, .6); voice("sine", mf(m) * 4.02, t, .012 * v, .5, 9000, .7); voice("triangle", mf(m), t, .03 * v, 1.2, 1800, .4); };
  const felt = (m, t, v = 1) => { voice("triangle", mf(m), t, .05 * v, 2.4, 1100, .45, .012); voice("sine", mf(m) * 2, t, .012 * v, 1.2, 1500, .45, .012); };
  function pad(notes, t, len) {
    notes.forEach((m, i) => [-5, 5].forEach(det => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = i ? "sine" : "triangle"; o.frequency.value = mf(m); o.detune.value = det;
      lp.type = "lowpass"; lp.frequency.value = 900; o.connect(lp); lp.connect(g); g.connect(dry); const s = ctx.createGain(); s.gain.value = .8; g.connect(s); s.connect(wet);
      const pk = .016; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + 1.3); g.gain.setValueAtTime(pk, t + len - .2); g.gain.linearRampToValueAtTime(0, t + len + 1.6);
      o.start(t); o.stop(t + len + 1.8); }));
  }
  function scheduleBar(i, t) {
    const k = i % 8, loop = Math.floor(i / 8);
    pad(CH[k], t, barLen);
    voice("sine", mf(BASS[k] + 12), t, .05, barLen * 1.1, 400, .3, .25);
    [[0, 0], [1.5, 2], [2.5, 1]].forEach(([b, n]) => felt(CH[k][n], t + b * beat + Math.random() * .01, .7));
    M[k].forEach(([b, m, d]) => {
      const tt = t + b * beat + (Math.random() - .5) * .012, sparkle = loop % 2 === 1;
      felt(m, tt, .9); musicBox(m + 12, tt, sparkle ? .55 : .35);
      if (sparkle && d >= 1 && Math.random() < .35) musicBox(m + 24, tt + beat * .5, .18);
    });
  }
  function pump() { while (nextBar < ctx.currentTime + 1.6) { scheduleBar(bar++, nextBar); nextBar += barLen; } }
  const btn = $("#music");
  function setUI() { btn.classList.toggle("on", on); btn.setAttribute("aria-pressed", on); btn.setAttribute("aria-label", on ? "Pause music" : "Play music"); }
  function start() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0;
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
        const shelf = ctx.createBiquadFilter(); shelf.type = "highshelf"; shelf.frequency.value = 5000; shelf.gain.value = -5;
        dry = ctx.createGain(); dry.gain.value = .75; wet = ctx.createGain(); wet.gain.value = 1;
        const rev = ctx.createConvolver(); rev.buffer = impulse(); const wetOut = ctx.createGain(); wetOut.gain.value = .55;
        dry.connect(master); wet.connect(rev); rev.connect(wetOut); wetOut.connect(master); master.connect(shelf); shelf.connect(comp); comp.connect(ctx.destination);
        nextBar = ctx.currentTime + .15;
      }
      ctx.resume(); on = true; setUI();
      const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(VOL, t + 3);
      if (nextBar < ctx.currentTime) nextBar = ctx.currentTime + .1;
      clearInterval(timer); pump(); timer = setInterval(pump, 250);
    } catch (e) { /* audio unavailable: the invite still works silently */ }
  }
  function pause() {
    if (!ctx) return; on = false; setUI(); const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + .6);
    clearInterval(timer); setTimeout(() => { if (!on) ctx.suspend(); }, 700);
  }
  btn.innerHTML = `<svg viewBox="-24 -24 48 48" aria-hidden="true"><g class="rs" filter="url(#wc)">${rose(15, "rose", rng(9))}</g><path class="bar" d="M-13 13 L13 -13" stroke="#A4626B" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  btn.addEventListener("click", () => on ? pause() : start());
  document.addEventListener("visibilitychange", () => { if (!ctx) return; if (document.hidden && on) { ctx.suspend(); clearInterval(timer); } else if (!document.hidden && on) { ctx.resume(); nextBar = Math.max(nextBar, ctx.currentTime + .1); timer = setInterval(pump, 250); } });
  return { start, pause, get on() { return on; } };
})();
